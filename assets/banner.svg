<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="1">
      <stop stop-color="#EC4899"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="22.5" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" stroke-dasharray="4 8"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke-dasharray="4 8"/>
    <line x1="550" y1="0" x2="550" y2="400" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke-dasharray="4 8"/>
    <line x1="850" y1="0" x2="850" y2="400" stroke-dasharray="4 8"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke-dasharray="4 8"/>
    <line x1="1150" y1="0" x2="1150" y2="400" stroke-dasharray="4 8"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(80, 80)">
    <rect width="210" height="32" rx="16" fill="#EC4899" fill-opacity="0.15"/>
    <text x="16" y="21" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">PLAYSPARK SOCIAL</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="165" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">Gamified Dating &amp; Social Discovery</text>
  <text x="80" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">Next.js 15 · Turbopack · React 19 · NextAuth · Mini-Games · Firebase FCM · Radix UI</text>

  <!-- Feature Pills -->
  <g transform="translate(80, 270)">
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🎮 Interactive Games</text>
    </g>
    <g transform="translate(195, 0)">
      <rect width="180" height="42" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">❤️ Match &amp; Discovery</text>
    </g>
    <g transform="translate(390, 0)">
      <rect width="180" height="42" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">💬 Real-Time Chat</text>
    </g>
    <g transform="translate(585, 0)">
      <rect width="180" height="42" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🔔 Push Notifications</text>
    </g>
  </g>
</svg>
